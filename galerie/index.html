<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie - Modellbahn-Treff | Bilder der Modellbahnanlage</title>
    <meta name="description" content="Galerie vom Modellbahn-Treff: Sehen Sie die Baufortschritte unserer Spur-N Anlage. Highlights, Details und Kinder beim Bauen und Fahren.">
    <meta name="keywords" content="Galerie, Bilder, Modellbahn, Fotos, Spur N, Baufortschritt">
    <meta name="author" content="Modellbahn-Treff for Kids GmbH">
    <link rel="canonical" href="https://www.modellbahn-treff.ch/galerie/">
    <link rel="stylesheet" href="/css/root.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/galerie.css">
    <link rel="stylesheet" href="/css/footer.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://code.jquery.com/jquery-1.11.3.min.js"></script>
</head>
<body>
    <header id="header"></header>
    <script>$("#header").load("/header.html");</script>
    <main>
        <h1>Galerie</h1>
        <section class="old_flickr_div">
            <article class="div_old">
                <p class="old_flickr_text">Bilder bis Juni 2020</p>
                <a href="https://www.modellbahn-treff.ch/bilder" class="flickr_button">Alte Galerie</a>
            </article>
            <article class="div_new">
                <p class="old_flickr_text">Bilder ab Juni 2020</p>
                <a href="https://www.flickr.com/photos/189183581@N03/" class="flickr_button">Neue Galerie</a>
            </article>
        </section>
        <h2>Highlights</h2>
        <section class="gallery">
            <img src="/img/highlights/image_anlage.jpg" alt="Modellbahnanlage - 60m² Spur N Großanlage" class="gallery-img">
            <img src="/img/highlights/image_kids.jpg" alt="Kids bauen Modellbahn - Kinder arbeiten handwerklich" class="gallery-img">
            <img src="/img/highlights/start_rading_krems2.jpg" alt="Modellbahn Fahrt - Züge auf der Strecke" class="gallery-img">
            <img src="/img/highlights/highlights_1.jpg" alt="Gleisplan und Landschaftsgestaltung - Modellbahndetails" class="gallery-img">
        </section>
        <script src="/js/gallery.js"></script>
    </main>
    <footer id="footer"></footer>
    <script>$("#footer").load("/footer.html");</script>
</body>
</html>
